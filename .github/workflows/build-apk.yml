name: Construir APK

# Se ejecuta solo cuando cambias index.html o el ícono, o a mano desde la pestaña Actions -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - icon-512.png
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Capacitor y la fuente pixel
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @fontsource/pixelify-sans @fontsource/dotgothic16

      - name: Preparar la app web (sin internet)
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-500-normal.woff2 www/fonts/ || echo "AVISO: no se encontro la fuente 500"
          cp node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2 www/fonts/ || echo "AVISO: no se encontro la fuente 700"
          mkdir -p www/fonts/dotgothic16
          cp -r node_modules/@fontsource/dotgothic16/index.css node_modules/@fontsource/dotgothic16/files www/fonts/dotgothic16/ || echo "AVISO: no se encontro la fuente japonesa"
          cat > www/fonts.css <<'EOF'
          @font-face{font-family:'Pixelify Sans';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
          @font-face{font-family:'Pixelify Sans';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
          EOF
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf8').read()
          s = re.sub(r'<link rel="stylesheet" href="https://fonts\.googleapis\.com[^>]*>', '<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="fonts/dotgothic16/index.css">', s)
          s = re.sub(r'<link rel="manifest"[^>]*>', '', s)
          s = re.sub(r"<script>\s*if\('serviceWorker' in navigator.*?</script>", '', s, flags=re.S)
          open('www/index.html', 'w', encoding='utf8').write(s)
          PY
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.miguikk7.tallerpixeles",
            "appName": "Taller de Píxeles",
            "webDir": "www",
            "backgroundColor": "#141a33",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          # ícono
          for d in android/app/src/main/res/mipmap-*; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              if [ -f "$d/$f" ]; then cp icon-512.png "$d/$f"; fi
            done
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#141A33</color>
          </resources>
          EOF
          # barra de estado y de navegación del mismo color de la app
          python3 - <<'PY'
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf8').read()
          a = '<item name="android:background">@null</item>'
          b = a + '\n        <item name="android:statusBarColor">#141A33</item>\n        <item name="android:navigationBarColor">#141A33</item>'
          if a in s:
              open(p, 'w', encoding='utf8').write(s.replace(a, b, 1))
          else:
              print('AVISO: no se encontro styles.xml como se esperaba')
          PY
          npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Taller-de-Pixeles.apk

      - name: Guardar el APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: Taller-de-Pixeles-APK
          path: Taller-de-Pixeles.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: Taller-de-Pixeles.apk
